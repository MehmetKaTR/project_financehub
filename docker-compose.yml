services:
  # ---------- ORACLE ----------
  oracle:
    image: gvenzl/oracle-free:latest
    environment:
      ORACLE_PASSWORD: hadibakalumoraclekardes   # SYSTEM sifresi
    ports:
      - "1521:1521"
    volumes:
      - ./docker/oracle-init:/container-entrypoint-initdb.d   # schema olusturma scriptleri (dogru yol: entrypoint)
    healthcheck:                          # "hazir mi" kontrolu (gvenzl'in kendi scripti)
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s                   # Oracle acilisi yavas — ilk 60sn hata sayma
    networks:
      - financehub-net

  # ---------- REDIS ----------
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - financehub-net

  # ---------- KAFKA (KRaft, Zookeeper'siz) ----------
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - financehub-net

  # ---------- EUREKA SERVER (servis rehberi) ----------
  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"
    networks:
      - financehub-net

  # ---------- USER SERVICE ----------
  user-service:
    build: ./user-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      SPRING_DATA_REDIS_HOST: redis          # cache backend (localhost -> redis container)
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      eureka-server:
        condition: service_started
      oracle:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - financehub-net

  # ---------- ACCOUNT SERVICE ----------
  account-service:
    build: ./account-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:9092
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      SPRING_CLOUD_VAULT_URI: http://vault:8200
    depends_on:
      eureka-server:
        condition: service_started
      oracle:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      vault:
        condition: service_started
    networks:
      - financehub-net

  # ---------- PAYMENT SERVICE ----------
  payment-service:
    build: ./payment-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:9092
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      eureka-server:
        condition: service_started
      oracle:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - financehub-net

  # ---------- API GATEWAY (tek giris kapisi) ----------
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      eureka-server:
        condition: service_started
    networks:
      - financehub-net

  # ---------- PROMETHEUS (metrik toplayici) ----------
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml   # scrape ayari
    networks:
      - financehub-net

  # ---------- GRAFANA (dashboard) ----------
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"        # host 3001 -> container 3000 (3000 baskasinda dolu)
    environment:
      GF_SECURITY_ADMIN_USER: admin          # panel giris kullanici
      GF_SECURITY_ADMIN_PASSWORD: admin      # panel giris sifre (dev)
    depends_on:
      - prometheus
    networks:
      - financehub-net

  # ---------- JAEGER (distributed tracing) ----------
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"      # Jaeger UI (tarayıcıdan bakacağız)
      - "4318:4318"        # OTLP HTTP (servisler span'leri buraya gönderir)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"    # OTLP alımını aç
    networks:
      - financehub-net

  # ---------- VAULT (secrets yönetimi) ----------
  vault:
    image: hashicorp/vault:latest
    ports:
      - "8200:8200"                          # Vault UI + API: http://localhost:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root          # dev root token (giriş anahtarı)
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK                             # Vault belleği diske yazılmasın (güvenlik)
    networks:
      - financehub-net

networks:
  financehub-net:
    driver: bridge